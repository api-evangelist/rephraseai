  /personalized-brand.api.rephrase.ai/v2/campaign/{campaign_id}:
    get:
      tags:
      - Video
      summary: Get video details
      description: 'Refer to create video API first if you haven''t already created a video.


        This API returns the video status and video URL.'
      operationId: get-video
      parameters:
      - name: Authorization
        in: header
        description: Authorize the request using your access token.
        required: true
        deprecated: false
        allowEmptyValue: false
        explode: false
        allowReserved: false
        schema:
          type: string
          default: Bearer <access_token>
      - name: campaign_id
        in: path
        description: Video ID
        required: true
        deprecated: false
        allowEmptyValue: false
        explode: false
        allowReserved: false
        schema:
          type: string
          default: <campaign_id>
      responses:
        '200':
          description: Get Video Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCampaignResponse'
      deprecated: false
  /personalized-brand.api.rephrase.ai/v2/campaign/{campaign_id}/export:
    post:
      tags:
      - Video
      summary: Export video
      description: 'Refer to create video API first if you haven''t already created a video


        This API generates your video.'
      operationId: export-video
      parameters:
      - name: Authorization
        in: header
        description: Authorize the request using your access token.
        required: true
        deprecated: false
        allowEmptyValue: false
        explode: false
        allowReserved: false
        schema:
          type: string
          default: Bearer <access_token>
      - name: campaign_id
        in: path
        description: Video ID
        required: true
        deprecated: false
        allowEmptyValue: false
        explode: false
        allowReserved: false
        schema:
          type: string
          default: <campaign_id>
      responses:
        '200':
