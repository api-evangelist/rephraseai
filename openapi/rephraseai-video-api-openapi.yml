            application/json:
              schema:
                $ref: '#/components/schemas/ExportCampaignResponse'
              example:
                details: Campaign scheduled successfully
                credits_left: <credits left>
      deprecated: false
components:
  schemas:
    SlideTransitionParams:
      title: SlideTransitionParams
      type: object
      properties:
        direction:
          title: Direction
          enum:
          - left
          - right
          - top
          - bottom
          type: string
          description: Direction of the linear transition. It can be 'left', 'right', 'top', or 'bottom'. Default is 'left'.
        motionBlur:
          title: Motionblur
          type: string
          description: Motion blur effect for the transition. Default is '0px', i.e. no motion blur.
    LineWipeSceneTransition:
      title: LineWipeSceneTransition
      required:
      - name
      - params
      type: object
      properties:
        name:
          title: Name
          enum:
          - lineWipe
          type: string
        params:
          $ref: '#/components/schemas/LinearDirectionTransitionParams'
    SimplifiedFullSceneTransition:
      title: SimplifiedFullSceneTransition
      required:
      - duration
      - preset
      - timingFunction
      type: object
      properties:
        duration:
          title: Duration
          type: number
          description: Duration of the full scene transition in seconds.
        preset:
          title: Preset
          anyOf:
          - $ref: '#/components/schemas/DissolveSceneTransition'
          - $ref: '#/components/schemas/PushSceneTransition'
          - $ref: '#/components/schemas/SlideSceneTransition'
          - $ref: '#/components/schemas/RollSceneTransition'
          - $ref: '#/components/schemas/StackSceneTransition'
          - $ref: '#/components/schemas/LineWipeSceneTransition'
          - $ref: '#/components/schemas/CircleWipeSceneTransition'
          - $ref: '#/components/schemas/ZoomSceneTransition'
          description: The type of scene transition.
        timingFunction:
          title: Timingfunction
          allOf:
          - $ref: '#/components/schemas/TimingFunction'
          description: Timing function to determine how the transition will progress.
    SimplifiedSceneTransitionSpec:
      title: SimplifiedSceneTransitionSpec
      required:
      - transition
      type: object
      properties:
        startScene:
          title: Startscene
          type: integer
          description: Starting scene index for the transition. Scenes are indexed from 0.
        endScene:
          title: Endscene
          type: integer
          description: Ending scene index for the transition. Scenes are indexed from 0.
        transition:
          $ref: '#/components/schemas/SimplifiedFullSceneTransition'
    SlideSceneTransition:
      title: SlideSceneTransition
      required:
      - name
      - params
      type: object
      properties:
        name:
          title: Name
          enum:
          - slide
