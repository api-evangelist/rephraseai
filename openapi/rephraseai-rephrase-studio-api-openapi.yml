openapi: 3.0.3
info:
  title: Rephrase Studio API
  version: v2
servers:
- url: /
paths:
  /auth.rephrase.ai/oauth/token:
    post:
      tags:
      - Authentication
      summary: Get Access Token
      description: '

        Contact us at [help@rephrase.ai](mailto:help@rephrase.ai) for your Client ID and Refresh Token.


        1. You can use your Client ID and Refresh Token to generate an Access Token.

        2. Access Tokens generated are valid for 24 hours.

        3. For usage of any other API calls, your request header needs `Authorization: Bearer <access_token>`

        '
      operationId: get-access-token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthRequest'
        required: false
      responses:
        '200':
          description: Authentication Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
      deprecated: false
      servers:
      - url: https://auth.rephrase.ai
  /personalized-brand.api.rephrase.ai/v2/actors:
    get:
      tags:
      - Actor
      summary: Get all supported actors
      description: '

        This API returns list of all supported actors

        '
      operationId: get-actors
      parameters:
      - name: Authorization
        in: header
        description: Authorize the request using your access token.
        required: true
        deprecated: false
        allowEmptyValue: false
        explode: false
        allowReserved: false
        schema:
          type: string
          default: Bearer <access_token>
      requestBody:
        content:
          application/json: {}
        required: false
      responses:
        '200':
          description: Response is a mapping of actor ids and corresponding actor properties.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimplifiedActorDict'
