  /personalized-brand.api.rephrase.ai/v2/campaign/{campaign_id}:
    get:
      tags:
      - Video
      summary: Get video details
      description: '

        Refer to [create video API](https://studio-rephrase-api.readme.io/reference/create-video) first if you haven''t already created a video.


        This API returns the video status and video URL.

        '
      operationId: get-video
      parameters:
      - name: Authorization
        in: header
        description: Authorize the request using your access token.
        required: true
        deprecated: false
        allowEmptyValue: false
        explode: false
        allowReserved: false
        schema:
          type: string
          default: Bearer <access_token>
      - name: campaign_id
        in: path
        description: Video ID
        required: true
        deprecated: false
        allowEmptyValue: false
        explode: false
        allowReserved: false
        schema:
          type: string
          default: <campaign_id>
      responses:
        '200':
          description: Get Video Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCampaignResponse'
      deprecated: false
  /personalized-brand.api.rephrase.ai/v2/campaign/{campaign_id}/export:
    post:
      tags:
      - Video
      summary: Export video
      description: '

        Refer to [create video API](https://studio-rephrase-api.readme.io/reference/create-video) first if you haven''t already created a video


        This API generates your video.

        '
      operationId: export-video
      parameters:
      - name: Authorization
        in: header
        description: Authorize the request using your access token.
        required: true
        deprecated: false
        allowEmptyValue: false
        explode: false
        allowReserved: false
        schema:
          type: string
          default: Bearer <access_token>
      - name: campaign_id
        in: path
        description: Video ID
        required: true
        deprecated: false
        allowEmptyValue: false
        explode: false
        allowReserved: false
        schema:
          type: string
          default: <campaign_id>
      responses:
        '200':
          description: Export Video Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportCampaignResponse'
              example:
                details: Campaign scheduled successfully
                credits_left: <credits left>
      deprecated: false
  /personalized-brand.api.rephrase.ai/v2/voices:
    get:
      tags:
      - Voice
      summary: Get all supported voices
      description: '

        This API returns list of all supported voices

        '
      operationId: get-voices
      parameters:
      - name: Authorization
        in: header
        description: Authorize the request using your access token.
        required: true
        deprecated: false
        allowEmptyValue: false
        explode: false
        allowReserved: false
        schema:
          type: string
          default: Bearer <access_token>
      requestBody:
        content:
          application/json: {}
        required: false
      responses:
        '200':
          description: Response is a mapping of voice ids and corresponding voice properties.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimplifiedVoiceDict'
              example:
                en-US-JennyMultilingualNeural__002:
                  voice_key: en-US-JennyMultilingualNeural__002
                  language: en-US
                  gender: female
                  title: Jenny Multilingual
                  voice_characteristics:
                  - age: Young Adult
                    tone: General
                    speed: Normal
                  use_cases: []
                  captions_supported: true
                  markers_supported: true
                  sample_link: https://hosted-rephraseai-videos.s3.us-east-1.amazonaws.com/audio/2022f83f-9667-4a46-ba65-3ecf19bb3c85.wav
      deprecated: false
